<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href='style.css'>
    <script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2' defer></script>
    <script src='supabase-config.js' defer></script>
    <script src='function.js' defer></script>
    <title>My Favorites - Movie Lookup</title>
</head>
<body data-page="profile">
    <div class="container">
        <header>
            <h1><button type="button" class="brand-link browse-trigger">Movie Lookup</button></h1>
            <div class="user-bar">
                <a class="profile-link" href="index.html">Browse</a>
                <span class="user-email"></span>
                <button type="button" class="logout-btn">Sign Out</button>
            </div>
        </header>
        <main>
            <section class="settings-section">
                <h2 class="page-heading">Account Settings</h2>

                <form class="settings-form name-form">
                    <label for="display-name">Name</label>
                    <input type="text" id="display-name" class="settings-input" placeholder="Your name">
                    <button type="submit" class="settings-btn">Save Name</button>
                    <p class="settings-message name-message hidden"></p>
                </form>

                <form class="settings-form password-form">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" class="settings-input" placeholder="New password" minlength="6" required>
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" class="settings-input" placeholder="Confirm new password" minlength="6" required>
                    <button type="submit" class="settings-btn">Update Password</button>
                    <p class="settings-message password-message hidden"></p>
                </form>
            </section>

            <h2 class="page-heading">My Favorites</h2>
            <section class="movie-list">
                <!-- Favorited movies will be dynamically inserted here -->
            </section>
        </main>
    </div>

    <div class="movie-modal hidden">
        <div class="movie-modal-content">
            <button type="button" class="close-modal">&times;</button>
            <h2 class="modal-title"></h2>
            <p class="modal-plot"></p>
            <p class="modal-cast"><strong>Cast:</strong> <span></span></p>
        </div>
    </div>

    <button type="button" class="back-to-top hidden" aria-label="Back to top">&uarr;</button>
</body>
</html>
