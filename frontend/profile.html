<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel='stylesheet' href='style.css'>
    <script src='function.js' defer></script>
    <title>My Favorites - Netflix Clone</title>
</head>
<body data-page="profile">
    <div class="container">
        <header>
            <h1>Netflix Clone</h1>
            <div class="user-bar">
                <a class="profile-link" href="index.html">Browse</a>
                <span class="user-email"></span>
                <button type="button" class="logout-btn">Sign Out</button>
            </div>
        </header>
        <main>
            <h2 class="page-heading">My Favorites</h2>
            <section class="movie-list">
                <!-- Favorited movies will be dynamically inserted here -->
            </section>
        </main>
    </div>

    <div class="movie-modal hidden">
        <div class="movie-modal-content">
            <button type="button" class="close-modal">&times;</button>
            <h2 class="modal-title"></h2>
            <p class="modal-plot"></p>
            <p class="modal-cast"><strong>Cast:</strong> <span></span></p>
        </div>
    </div>
</body>
</html>
